<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siden finnes ikke – Let's Learn Trafikkskole</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      background: var(--navy-dark);
    }
    .error-page__logo { height: 64px; width: auto; margin-bottom: 40px; }
    .error-page__code {
      font-size: 96px;
      font-weight: 800;
      color: var(--green);
      line-height: 1;
      margin-bottom: 8px;
    }
    .error-page__title {
      font-size: 24px;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 12px;
    }
    .error-page__text {
      font-size: 15px;
      color: rgba(255,255,255,.65);
      max-width: 380px;
      margin-bottom: 32px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <img src="images/lets_learn_logo_1.png" alt="Let's Learn Trafikkskole" class="error-page__logo">
    <p class="error-page__code">404</p>
    <h1 class="error-page__title">Siden finnes ikke</h1>
    <p class="error-page__text">Beklager, vi finner ikke siden du leter etter.</p>
    <a href="https://letslearntrafikkskole.no/" class="btn btn--primary">Tilbake til forsiden</a>
  </div>
</body>
</html>
